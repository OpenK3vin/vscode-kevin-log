name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Debug secret presence (length only, never the value)
        run: |
          echo "OVSX_PAT length: ${#OVSX_PAT}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create Version PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bash -c "yarn install --immutable && yarn run version"
          publish: bash -c "yarn install --immutable && yarn release"
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
